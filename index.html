<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Ledger"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F5C45"><meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>My Ledger</title>
<style>
html{padding-top:env(safe-area-inset-top,0px);margin:0}body{margin:0}[hidden]{display:none!important}

/* Layout: one-column phone app. Two currency cards (USD green, LBP slate) on top, bottom tab bar, bottom-sheet for entry. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface2:#E3E9E1; --ink:#15211B; --muted:#5B6A61; --line:#D2DAD0;
  --usd:#0F5C45; --lbp:#2F3E57; --on-card:#FFFFFF;
  --in:#1B7F4E; --out:#C4472B;
  --accent:#0F5C45; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(20,33,27,.06),0 8px 24px rgba(20,33,27,.06);
  --f-body:system-ui,-apple-system,"SF Arabic","Geeza Pro","Segoe UI",sans-serif;
  --f-display:system-ui,-apple-system,"SF Arabic","Geeza Pro","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#18211C; --surface2:#222D26; --ink:#E7EEE9; --muted:#94A49B; --line:#2B3930;
  --usd:#17795A; --lbp:#3D5478; --in:#4CC38A; --out:#F0836A; --accent:#3DB88A; --on-accent:#08140F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#18211C; --surface2:#222D26; --ink:#E7EEE9; --muted:#94A49B; --line:#2B3930;
  --usd:#17795A; --lbp:#3D5478; --in:#4CC38A; --out:#F0836A; --accent:#3DB88A; --on-accent:#08140F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:ltr;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.unit{font-size:.8em;color:inherit;opacity:.75;margin-inline-start:.25em}
#app{max-width:560px;margin:0 auto;padding-block:14px 120px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:0}
.dateline{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.cap{font-size:13px;opacity:.85}

/* currency cards */
.card{border-radius:20px;padding:18px 18px 16px;color:var(--on-card);box-shadow:var(--shadow)}
.card.usd{background:var(--usd)} .card.lbp{background:var(--lbp)}
.card .big{font-family:var(--f-display);font-size:38px;line-height:1.15;font-weight:700;margin:4px 0 12px;overflow-wrap:anywhere}
.card .big .unit{font-size:16px}
.card .sub{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.card .sub>div{flex:1 1 120px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-width:0}
.card .sub b{display:block;font-weight:600;font-size:15px}

.panel{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.panel>h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel>h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.link{color:var(--accent);font-size:13px;font-weight:600;padding:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.mini .t{font-size:12px;color:var(--muted);font-weight:600}
.mini .r{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 6px;font-size:13.5px;margin-top:4px}
.in{color:var(--in)} .out{color:var(--out)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:start;min-width:0}
.list>.row:first-child{border-top:0}
.badge{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface2)}
.badge.usd{background:color-mix(in srgb,var(--usd) 18%,transparent);color:var(--usd)}
.badge.lbp{background:color-mix(in srgb,var(--lbp) 18%,transparent);color:var(--lbp)}
:root[data-theme="dark"] .badge.usd,:root[data-theme="dark"] .badge.lbp{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.usd,:root:not([data-theme="light"]) .badge.lbp{color:var(--ink)}}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:600;flex:none}
.empty{color:var(--muted);text-align:center;padding:18px 8px;line-height:1.7}
.dayhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:18px 2px 6px;font-size:13px;color:var(--muted);font-weight:600}
.dayhead .tot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* controls */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.kind button[data-k="in"][aria-pressed="true"]{background:var(--in);color:#fff}
.seg.kind button[data-k="out"][aria-pressed="true"]{background:var(--out);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav .ttl{font-weight:600;text-align:center;flex:1;min-width:0}
.nav button.ic{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.nav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:13px 16px;font-weight:700;width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--out);border:1.5px solid var(--out)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabbar .tabin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:4px;align-items:center;color:inherit}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:-22px 6px 0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  max-height:94%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-size:20px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;font-size:16px;min-width:0}
.field input:focus{border-color:var(--accent);outline:0}
.field input.amount{font-family:var(--f-display);font-size:30px;font-weight:700;direction:ltr;text-align:left;padding:10px 14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-row{display:flex;gap:8px;align-items:center}
.date-row input{flex:1}

/* charts and bars */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--in)} .chart .bo{fill:var(--out)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .mini .v{font-size:17px;font-weight:700;margin-top:2px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin-top:10px;font-size:14px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--out)}
.bar.inc .fill{background:var(--in)}
.cur-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:12px}
.cur-title .badge{width:30px;height:30px;border-radius:10px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}
.warn{background:color-mix(in srgb,var(--out) 14%,var(--surface));border:1.5px solid var(--out);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.7}
.warn b{color:var(--out)}
.okline{color:var(--in);font-weight:600}
.sync .btn{margin-top:8px}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style></head><body>
<div id="app">
  <div id="view"></div>
</div>
<nav class="tabbar" aria-label="Main"><div class="tabin">
  <button class="tab" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="tab" data-tab="log" aria-label="History"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</button>
  <button class="fab" id="fab" aria-label="Add transaction"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="report" aria-label="Reports"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Reports</button>
</div></nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
/* standalone shim: saves downloads through a normal browser download */
window.claude={use:function(n){
  if(n!=="downloads")return Promise.resolve(null);
  return Promise.resolve({save:function(o){
    var b=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.json$/.test(o.filename)?"application/json":"text/csv"});
    var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);return Promise.resolve();
  }});
}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var LSKEY="hesabati.v1";
var $=function(s,r){return (r||document).querySelector(s)};
var pad=function(n){return String(n).padStart(2,"0")};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var todayStr=function(){return ymd(new Date())};
var pd=function(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var CUR={USD:{cls:"usd",sym:"$",label:"USD",short:"$"},LBP:{cls:"lbp",sym:"LBP",label:"LBP",short:"LL"}};
var CURS=["USD","LBP"];

/* ---------- state ---------- */
var txs=[];            // {id,kind:'in'|'out',cur,amount,name,date,ts}
var ui={tab:"home",logCur:"ALL",logKind:"ALL",repMode:"day",repDay:todayStr(),repMonth:todayStr().slice(0,7),mode:"local"};
var health={ls:false,db:"pending"};
var col=null;          // db collection when available

function readLocal(){try{var r=localStorage.getItem(LSKEY);return r?JSON.parse(r):[]}catch(e){return []}}
function writeLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(txs))}catch(e){}}

/* ---------- formatting ---------- */
function numStr(cur,n){
  var a=Math.abs(n);
  if(cur==="USD")return a.toLocaleString("en-US",{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2});
  return Math.round(a).toLocaleString("en-US");
}
function money(cur,n,withSign){
  var sign=n<0?"-":(withSign&&n>0?"+":"");
  if(cur==="USD")return '<span class="num">'+sign+"$"+numStr(cur,n)+"</span>";
  return '<span class="num">'+sign+numStr(cur,n)+'</span><span class="unit">LBP</span>';
}
function dayLabel(s){var d=pd(s);return DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate()}
function dayLabelFull(s){var d=pd(s);return dayLabel(s)+", "+d.getFullYear()}
function monthLabel(m){var p=m.split("-");return MONTHS[+p[1]-1]+" "+p[0]}
function relDay(s){
  var t=todayStr();if(s===t)return"Today";
  var y=new Date();y.setDate(y.getDate()-1);if(s===ymd(y))return"Yesterday";
  return dayLabel(s);
}
function parseNum(v){
  v=String(v).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[٫]/g,".").replace(/[٬,\s]/g,"");
  var n=parseFloat(v);return isFinite(n)?n:NaN;
}

/* ---------- math ---------- */
function totals(list,cur){
  var i=0,o=0;list.forEach(function(t){if(t.cur!==cur)return;if(t.kind==="in")i+=t.amount;else o+=t.amount});
  return {in:i,out:o,net:i-o};
}
function byDate(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)}
function upTo(date){return txs.filter(function(t){return t.date<=date})}
function monthTxs(m){return txs.filter(function(t){return t.date.slice(0,7)===m})}
function groupNames(list,cur,kind){
  var map={};
  list.forEach(function(t){if(t.cur!==cur||t.kind!==kind)return;var k=t.name.trim().toLowerCase();
    (map[k]=map[k]||{name:t.name.trim(),sum:0,n:0});map[k].sum+=t.amount;map[k].n++});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.sum-a.sum});
}

/* ---------- views ---------- */
function icon(dir){
  return dir==="r"?'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>':'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
}
function txRow(t){
  var c=CUR[t.cur];
  return '<button class="row" data-edit="'+esc(t.id)+'"><span class="badge '+c.cls+'">'+c.short+'</span>'+
    '<span class="mid"><div class="nm">'+esc(t.name)+'</div><div class="mt">'+(t.kind==="in"?"Income":"Expense")+" · "+relDay(t.date)+'</div></span>'+
    '<span class="amt '+(t.kind==="in"?"in":"out")+'">'+money(t.cur,t.kind==="in"?t.amount:-t.amount,true)+'</span></button>';
}
function miniBlock(cur,list){
  var tt=totals(list,cur);
  return '<div class="mini"><div class="t">'+CUR[cur].label+'</div>'+
    '<div class="r"><span>Income</span><span class="in">'+money(cur,tt.in)+'</span></div>'+
    '<div class="r"><span>Expense</span><span class="out">'+money(cur,tt.out)+'</span></div></div>';
}

function viewHome(){
  var now=new Date(),m=todayStr().slice(0,7),mt=monthTxs(m),td=txs.filter(function(t){return t.date===todayStr()});
  var h='<div class="top"><div><div class="brand">My Ledger</div><div class="dateline">'+dayLabelFull(todayStr())+'</div></div></div><div class="stack">'+warnBanner();
  CURS.forEach(function(cur){
    var all=totals(txs,cur),mm=totals(mt,cur);
    h+='<section class="card '+CUR[cur].cls+'"><div class="cap">Balance · '+CUR[cur].label+'</div>'+
      '<div class="big">'+money(cur,all.net)+'</div>'+
      '<div class="sub"><div>Income · '+MONTHS[now.getMonth()]+'<b>'+money(cur,mm.in)+'</b></div><div>Expenses · '+MONTHS[now.getMonth()]+'<b>'+money(cur,mm.out)+'</b></div></div></section>';
  });
  h+='<section class="panel"><h3>Today<small>'+dayLabel(todayStr())+'</small></h3><div class="cols">'+miniBlock("USD",td)+miniBlock("LBP",td)+'</div></section>';
  var recent=txs.slice().sort(byDate).slice(0,6);
  h+='<section class="panel"><h3>Recent activity<button class="link" data-go="log">See all</button></h3>';
  if(!recent.length)h+='<div class="empty">No transactions yet.<br>Tap + to add your first income or expense.</div>';
  else h+='<div class="list">'+recent.map(txRow).join("")+'</div>';
  h+='</section>'+syncNote()+'</div>';
  return h;
}

function viewLog(){
  var list=txs.filter(function(t){return (ui.logCur==="ALL"||t.cur===ui.logCur)&&(ui.logKind==="ALL"||t.kind===ui.logKind)}).sort(byDate);
  var h='<div class="top"><h1 class="brand">History</h1></div><div class="stack">';
  h+='<div class="seg" role="group" aria-label="Currency">'+[["ALL","All"],["USD","USD $"],["LBP","LBP"]].map(function(x){return '<button data-logcur="'+x[0]+'" aria-pressed="'+(ui.logCur===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
  h+='<div class="seg" role="group" aria-label="Type">'+[["ALL","All"],["in","Income"],["out","Expense"]].map(function(x){return '<button data-logkind="'+x[0]+'" aria-pressed="'+(ui.logKind===x[0])+'">'+x[1]+'</button>'}).join("")+'</div></div>';
  if(!list.length)return h+'<div class="empty" style="margin-top:24px">No transactions match this filter.</div>';
  var cur=null,html="",bucket=[];
  function flush(){
    if(cur===null)return;
    var tt=CURS.filter(function(c){return (ui.logCur==="ALL"||ui.logCur===c)&&bucket.some(function(t){return t.cur===c})}).map(function(c){var n=totals(bucket,c).net;return '<span class="'+(n>=0?"in":"out")+'">'+money(c,n,true)+'</span>'}).join("");
    html+='<div class="dayhead"><span>'+relDay(cur)+(cur!==todayStr()?"":" · "+dayLabel(cur))+'</span><span class="tot">'+tt+'</span></div><div class="panel"><div class="list">'+bucket.map(txRow).join("")+'</div></div>';
  }
  list.forEach(function(t){if(t.date!==cur){flush();cur=t.date;bucket=[]}bucket.push(t)});
  flush();
  return h+html;
}

function chartSVG(m,cur){
  var p=m.split("-"),ndays=new Date(+p[0],+p[1],0).getDate(),inn=[],out=[],i;
  for(i=0;i<ndays;i++){inn.push(0);out.push(0)}
  monthTxs(m).forEach(function(t){if(t.cur!==cur)return;var d=+t.date.slice(8)-1;if(t.kind==="in")inn[d]+=t.amount;else out[d]+=t.amount});
  var max=Math.max.apply(null,inn.concat(out));
  if(max<=0)return '<div class="empty">No transactions in this currency this month.</div>';
  var W=320,H=110,L=0,R=40,T=8,B=16,pw=W-L-R,ph=H-T-B,step=pw/ndays,bw=Math.max(1.6,step*0.36),s="";
  // nice max
  var mag=Math.pow(10,Math.floor(Math.log10(max))),nm=Math.ceil(max/mag*2)/2*mag;if(nm<max)nm=max;
  [0,.5,1].forEach(function(f){var y=T+ph-ph*f;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(W-R+4)+'" y="'+(y+3)+'" text-anchor="start">'+abbr(nm*f)+'</text>'});
  for(i=0;i<ndays;i++){
        var x=L+i*step+(step-2*bw)/2;
    if(inn[i]>0){var h1=ph*inn[i]/nm;s+='<rect class="bi" x="'+(x+bw)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="1"/>'}
    if(out[i]>0){var h2=ph*out[i]/nm;s+='<rect class="bo" x="'+x+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="1"/>'}
    if((i+1)%5===0||i===0)s+='<text x="'+(L+(i+.5)*step)+'" y="'+(H-3)+'" text-anchor="middle">'+(i+1)+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily income and expenses" direction="ltr">'+s+'</svg>'+
    '<div class="legend"><span><i style="background:var(--in)"></i>Income</span><span><i style="background:var(--out)"></i>Expense</span></div>';
}
function abbr(n){
  if(n>=1e6)return (Math.round(n/1e5)/10)+"M";
  if(n>=1e3)return (Math.round(n/100)/10)+"k";
  return String(Math.round(n*10)/10);
}
function bars(list,cur,kind){
  var g=groupNames(list,cur,kind).slice(0,5);
  if(!g.length)return '<div class="mt" style="color:var(--muted);font-size:13px;margin-top:6px">Nothing yet</div>';
  var mx=g[0].sum;
  return g.map(function(x){return '<div class="bar '+(kind==="in"?"inc":"")+'"><span class="nm">'+esc(x.name)+(x.n>1?' <span style="color:var(--muted)">×'+x.n+'</span>':"")+'</span><span>'+money(cur,x.sum)+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(3,x.sum/mx*100)+'%"></span></span></div>'}).join("");
}

function viewReport(){
  var h='<div class="top"><h1 class="brand">Reports</h1></div><div class="stack">';
  h+='<div class="seg" role="group" aria-label="Report type"><button data-rep="day" aria-pressed="'+(ui.repMode==="day")+'">Daily</button><button data-rep="month" aria-pressed="'+(ui.repMode==="month")+'">Monthly</button></div>';
  if(ui.repMode==="day"){
    var d=ui.repDay,list=txs.filter(function(t){return t.date===d}),cum=upTo(d);
    h+='<div class="nav"><button class="ic" data-step="-1" aria-label="Previous day">'+icon("l")+'</button><div class="ttl">'+dayLabelFull(d)+(d===todayStr()?'<div class="dateline">Today</div>':"")+'</div><button class="ic" data-step="1" aria-label="Next day">'+icon("r")+'</button></div>';
    CURS.forEach(function(cur){
      var tt=totals(list,cur),bal=totals(cum,cur).net;
      h+='<section class="panel"><div class="cur-title"><span class="badge '+CUR[cur].cls+'">'+CUR[cur].short+'</span>'+CUR[cur].label+'</div><div class="kv">'+
        '<div class="mini"><div class="t">Income</div><div class="v in">'+money(cur,tt.in)+'</div></div>'+
        '<div class="mini"><div class="t">Expense</div><div class="v out">'+money(cur,tt.out)+'</div></div>'+
        '<div class="mini"><div class="t">Net today</div><div class="v '+(tt.net>=0?"in":"out")+'">'+money(cur,tt.net,true)+'</div></div>'+
        '<div class="mini"><div class="t">Balance at end of day</div><div class="v">'+money(cur,bal)+'</div></div></div></section>';
    });
    h+='<section class="panel"><h3>Transactions today<small>'+list.length+'</small></h3>'+(list.length?'<div class="list">'+list.slice().sort(byDate).map(txRow).join("")+'</div>':'<div class="empty">No transactions on this day.</div>')+'</section>';
    h+='<button class="btn ghost" data-jump="today">Go to today</button>';
  }else{
    var m=ui.repMonth,ml=monthTxs(m),p=m.split("-"),last=p[0]+"-"+p[1]+"-"+pad(new Date(+p[0],+p[1],0).getDate());
    var isCur=m===todayStr().slice(0,7),daysPassed=isCur?new Date().getDate():new Date(+p[0],+p[1],0).getDate();
    h+='<div class="nav"><button class="ic" data-step="-1" aria-label="Previous month">'+icon("l")+'</button><div class="ttl">'+monthLabel(m)+'</div><button class="ic" data-step="1" aria-label="Next month">'+icon("r")+'</button></div>';
    CURS.forEach(function(cur){
      var tt=totals(ml,cur),bal=totals(upTo(last),cur).net;
      h+='<section class="panel"><div class="cur-title"><span class="badge '+CUR[cur].cls+'">'+CUR[cur].short+'</span>'+CUR[cur].label+'</div><div class="kv">'+
        '<div class="mini"><div class="t">Income this month</div><div class="v in">'+money(cur,tt.in)+'</div></div>'+
        '<div class="mini"><div class="t">Expenses this month</div><div class="v out">'+money(cur,tt.out)+'</div></div>'+
        '<div class="mini"><div class="t">Net</div><div class="v '+(tt.net>=0?"in":"out")+'">'+money(cur,tt.net,true)+'</div></div>'+
        '<div class="mini"><div class="t">Balance at month end</div><div class="v">'+money(cur,bal)+'</div></div></div>'+
        '<div class="mt" style="margin:10px 2px 8px;font-size:13px;color:var(--muted)">Average daily spending: '+money(cur,tt.out/daysPassed)+'</div>'+
        chartSVG(m,cur)+
        '<h3 style="font-size:14px;margin-top:16px">Top spending</h3>'+bars(ml,cur,"out")+
        '<h3 style="font-size:14px;margin-top:16px">Top income sources</h3>'+bars(ml,cur,"in")+'</section>';
    });
    h+='<button class="btn ghost" id="exportCsv">Download month report (CSV)</button><button class="btn ghost" data-jump="today">Go to this month</button>';
  }
  return h+'</div>';
}

var WHY={
  pending:"Connecting to your account...",
  none:"The app is open outside Claude, so it cannot save to your account.",
  nodb:"Could not reach your account storage. Open the link from the Claude app while signed in.",
  nouser:"Could not tell who is using the app. Make sure you are signed in to Claude.",
  noid:"Could not tell who is using the app. Make sure you are signed in to Claude.",
  err:"The connection to your account storage was lost.",
  writefail:"The last transaction could not be saved to your account."
};
function warnBanner(){
  if(health.db==="ok"||health.db==="pending")return"";
  var m=WHY[health.db]||WHY.nodb;
  return '<div class="warn"><b>Heads up: your data is not saved permanently.</b><br>'+m+(health.ls?" It is only kept on this device and may be erased when you close the app.":" This device is also blocking local storage, so everything is erased when you close the app.")+'<br>Download a backup after you enter transactions.</div>';
}
function syncNote(){
  var st=health.db==="ok"?'<div class="okline">Saved on this device ✓ · works offline</div>':'<div>'+(WHY[health.db]||"")+'</div>';
  return '<div class="sync">'+st+
    '<button class="btn ghost small" id="backup">Download backup</button> <button class="btn ghost small" id="restore">Restore from backup</button>'+
    '<input type="file" id="restoreFile" accept=".json,application/json" hidden></div>';
}
function render(){
  var v=$("#view");
  v.innerHTML=ui.tab==="home"?viewHome():ui.tab==="log"?viewLog():viewReport();
  document.querySelectorAll(".tab").forEach(function(b){if(b.dataset.tab===ui.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
}

/* ---------- sheet ---------- */
var draft=null,confirmDel=false;
function openSheet(t){
  confirmDel=false;
  var last=txs.slice().sort(byDate)[0];
  draft=t?{id:t.id,kind:t.kind,cur:t.cur,amount:String(t.amount),name:t.name,date:t.date,edit:true}:
    {id:null,kind:"out",cur:last?last.cur:"USD",amount:"",name:"",date:todayStr(),edit:false};
  drawSheet();
  setTimeout(function(){var a=$("#fAmount");if(a&&!draft.edit)a.focus()},60);
}
function closeSheet(){$("#sheetHost").innerHTML="";draft=null}
function recentNames(kind){
  var seen={},out=[];
  txs.slice().sort(byDate).forEach(function(t){if(t.kind!==kind)return;var k=t.name.trim().toLowerCase();if(seen[k])return;seen[k]=1;out.push(t.name.trim())});
  return out.slice(0,8);
}
function hintText(){
  var n=parseNum(draft.amount);if(!draft.amount||isNaN(n))return"";
  return "= "+(draft.cur==="USD"?"$"+numStr("USD",n):numStr("LBP",n)+" LBP");
}
function drawSheet(){
  var d=draft,names=recentNames(d.kind);
  $("#sheetHost").innerHTML='<div class="scrim" id="scrim"><form class="sheet" id="sheetForm" role="dialog" aria-modal="true" aria-label="Transaction">'+
    '<h2>'+(d.edit?"Edit transaction":"New transaction")+'</h2>'+
    '<div class="seg kind" role="group" aria-label="Type"><button type="button" data-k="out" aria-pressed="'+(d.kind==="out")+'">Expense</button><button type="button" data-k="in" aria-pressed="'+(d.kind==="in")+'">Income</button></div>'+
    '<div class="seg" role="group" aria-label="Currency"><button type="button" data-c="USD" aria-pressed="'+(d.cur==="USD")+'">US Dollar $</button><button type="button" data-c="LBP" aria-pressed="'+(d.cur==="LBP")+'">Lebanese Pound</button></div>'+
    '<div class="field"><label for="fAmount">Amount</label><input class="amount" id="fAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(d.amount)+'"><div class="hint" id="fHint">'+hintText()+'</div></div>'+
    '<div class="field"><label for="fName">What is it for?</label><input id="fName" autocomplete="off" placeholder="'+(d.kind==="in"?"e.g. Website project payment":"e.g. Fuel, lunch, subscription")+'" value="'+esc(d.name)+'">'+
      (names.length?'<div class="chips">'+names.map(function(n){return '<button type="button" class="chip" data-name="'+esc(n)+'">'+esc(n)+'</button>'}).join("")+'</div>':"")+'</div>'+
    '<div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="'+d.date+'"></div>'+
    '<div id="fErr" class="hint out" role="alert"></div>'+
    '<button class="btn" type="submit">'+(d.edit?"Save changes":"Save")+'</button>'+
    (d.edit?(confirmDel?'<button type="button" class="btn danger" id="delYes">Sure? Tap again to delete</button>':'<button type="button" class="btn danger" id="delAsk">Delete transaction</button>'):"")+
    '<button type="button" class="btn ghost" id="cancel">Cancel</button></form></div>';
}
function syncDraft(){
  var a=$("#fAmount"),n=$("#fName"),dt=$("#fDate");
  if(a)draft.amount=a.value;if(n)draft.name=n.value;if(dt&&dt.value)draft.date=dt.value;
}

/* ---------- data ops ---------- */
function toast(msg){
  var h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML=""},2200);
}
function newId(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cloudWrite(op){
  if(!col)return Promise.resolve();
  return op().catch(function(){health.db="writefail";toast("Could not save to your account");render()});
}
function saveTx(t){
  var i=txs.findIndex(function(x){return x.id===t.id});
  if(i>=0)txs[i]=t;else txs.push(t);
  writeLocal();render();
  var body={kind:t.kind,cur:t.cur,amount:t.amount,name:t.name,date:t.date,ts:t.ts};
  return cloudWrite(function(){return col.doc(t.id).set(body)});
}
function delTx(id){
  txs=txs.filter(function(x){return x.id!==id});
  writeLocal();render();
  return cloudWrite(function(){return col.doc(id).delete()});
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-go],[data-logcur],[data-logkind],[data-rep],[data-step],[data-jump],[data-edit],[data-k],[data-c],[data-name],#fab,#cancel,#scrim,#delAsk,#delYes,#exportCsv,#backup,#restore");
  if(!el)return;
  if(el.id==="scrim"){if(e.target===el)closeSheet();return}
  var ds=el.dataset;
  if(el.id==="fab"){openSheet(null);return}
  if(el.id==="cancel"){closeSheet();return}
  if(el.id==="exportCsv"){exportCsv();return}
  if(el.id==="backup"){backup();return}
  if(el.id==="restore"){var rf=$("#restoreFile");if(rf)rf.click();return}
  if(draft){
    if(ds.k||ds.c||ds.name){
      syncDraft();
      if(ds.k)draft.kind=ds.k;if(ds.c)draft.cur=ds.c;if(ds.name)draft.name=ds.name;
      drawSheet();return;
    }
    if(el.id==="delAsk"){syncDraft();confirmDel=true;drawSheet();return}
    if(el.id==="delYes"){var id=draft.id;closeSheet();delTx(id);toast("Deleted");return}
  }
  if(ds.tab){ui.tab=ds.tab;render();window.scrollTo(0,0);return}
  if(ds.go){ui.tab=ds.go;render();window.scrollTo(0,0);return}
  if(ds.logcur){ui.logCur=ds.logcur;render();return}
  if(ds.logkind){ui.logKind=ds.logkind;render();return}
  if(ds.rep){ui.repMode=ds.rep;render();return}
  if(ds.jump){ui.repDay=todayStr();ui.repMonth=todayStr().slice(0,7);render();return}
  if(ds.step){
    var s=+ds.step;
    if(ui.repMode==="day"){var d=pd(ui.repDay);d.setDate(d.getDate()+s);ui.repDay=ymd(d)}
    else{var p=ui.repMonth.split("-"),dm=new Date(+p[0],+p[1]-1+s,1);ui.repMonth=dm.getFullYear()+"-"+pad(dm.getMonth()+1)}
    render();return;
  }
  if(ds.edit){var t=txs.find(function(x){return x.id===ds.edit});if(t)openSheet(t)}
});
document.addEventListener("input",function(e){
  if(e.target.id==="fAmount"&&draft){draft.amount=e.target.value;$("#fHint").textContent=hintText()}
});
document.addEventListener("submit",function(e){
  e.preventDefault();if(!draft)return;
  syncDraft();
  var n=parseNum(draft.amount),err=$("#fErr");
  if(isNaN(n)||n<=0){err.textContent="Enter the amount as a number.";return}
  if(!draft.name.trim()){err.textContent="Enter what it is for (for example fuel or a client payment).";return}
  if(!draft.date){err.textContent="Choose a date.";return}
  var old=draft.id?txs.find(function(x){return x.id===draft.id}):null;
  var t={id:draft.id||newId(),kind:draft.kind,cur:draft.cur,amount:Math.round(n*100)/100,name:draft.name.trim(),date:draft.date,ts:old?old.ts:Date.now()};
  var wasEdit=draft.edit;closeSheet();saveTx(t);toast(wasEdit?"Updated":"Saved");
});

/* ---------- export ---------- */
function exportCsv(){
  var m=ui.repMonth,rows=[["Date","Type","Currency","Amount","Name"]];
  monthTxs(m).slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(t){rows.push([t.date,t.kind==="in"?"Income":"Expense",t.cur,t.amount,t.name])});
  CURS.forEach(function(c){var tt=totals(monthTxs(m),c);rows.push([]);rows.push(["Total "+c,"Income",c,tt.in,""]);rows.push(["","Expense",c,tt.out,""]);rows.push(["","Net",c,tt.net,""])});
  var csv="﻿"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  if(!window.claude||!window.claude.use){toast("Downloads are not available here");return}
  window.claude.use("downloads").then(function(dl){
    if(!dl){toast("Downloads are not available here");return}
    return dl.save({filename:"ledger-"+m+".csv",data:csv}).catch(function(err){if(!err||err.code!=="declined")toast("Could not save the file")});
  });
}

/* ---------- backup ---------- */
function backup(){
  var data=JSON.stringify({app:"hesabati",exported:new Date().toISOString(),items:txs},null,1);
  if(!window.claude||!window.claude.use){toast("Downloads are not available here");return}
  window.claude.use("downloads").then(function(dl){
    if(!dl){toast("Downloads are not available here");return}
    return dl.save({filename:"ledger-backup-"+todayStr()+".json",data:data}).then(function(){toast("Backup downloaded")}).catch(function(err){if(!err||err.code!=="declined")toast("Could not save the file")});
  });
}
document.addEventListener("change",function(e){
  if(e.target.id!=="restoreFile"||!e.target.files||!e.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result),arr=Array.isArray(j)?j:j.items,n=0;
      arr.forEach(function(t){
        if(!t||!t.id||!t.date||!isFinite(t.amount)||(t.kind!=="in"&&t.kind!=="out")||(t.cur!=="USD"&&t.cur!=="LBP"))return;
        var c={id:String(t.id),kind:t.kind,cur:t.cur,amount:+t.amount,name:String(t.name||"").slice(0,120),date:t.date,ts:t.ts||Date.now()};
        var k=txs.findIndex(function(x){return x.id===c.id});if(k>=0)txs[k]=c;else txs.push(c);
        if(col)col.doc(c.id).set({kind:c.kind,cur:c.cur,amount:c.amount,name:c.name,date:c.date,ts:c.ts}).catch(function(){health.db="writefail";render()});
        n++;
      });
      writeLocal();render();toast("Restored "+n+" transactions");
    }catch(err){toast("That file is not a valid backup")}
  };
  fr.readAsText(e.target.files[0]);
  e.target.value="";
});

/* ---------- boot ---------- */
try{localStorage.setItem("hesabati.test","1");localStorage.removeItem("hesabati.test");health.ls=true}catch(e){}
txs=readLocal();render();
var tries=0;
function rowBody(t){return {kind:t.kind,cur:t.cur,amount:t.amount,name:t.name,date:t.date,ts:t.ts}}
function retry(){if(++tries<4)setTimeout(connect,3000)}
function connect(){
  if(!window.claude||!window.claude.use){health.db="none";render();return}
  Promise.race([Promise.all([window.claude.use("db"),window.claude.use("user")]),new Promise(function(res){setTimeout(function(){res([null,null])},12000)})]).then(function(r){
    var db=r[0],user=r[1];
    if(!db){health.db="nodb";render();retry();return}
    if(!user){health.db="nouser";render();retry();return}
    return user.id().then(function(id){
      if(!id){health.db="noid";render();retry();return}
      col=db.collection("data/users/"+id);
      var first=true;
      col.onSnapshot(function(snap){
        if(snap.metadata.fromCache&&snap.empty)return; // wait for the server's answer
        var remote={};snap.docs.forEach(function(d){var x=d.data();x.id=d.id;remote[d.id]=x});
        var merged=Object.keys(remote).map(function(k){return remote[k]});
        if(first){
          first=false; // anything saved only on this device goes up to the account
          txs.forEach(function(t){
            if(remote[t.id])return;
            merged.push(t);
            col.doc(t.id).set(rowBody(t)).catch(function(){health.db="writefail";render()});
          });
        }
        txs=merged;health.db="ok";writeLocal();
        if(!draft)render();
      },function(){health.db="err";render()});
    });
  }).catch(function(){health.db="nodb";render();retry()});
}
health.db="ok";render();
})();

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
